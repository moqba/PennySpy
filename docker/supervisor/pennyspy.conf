; Documentation of this file format -> http://supervisord.org/configuration.html
;
; Runs the PennySpy FastAPI/uvicorn server under the selenium base image's supervisord.
; The bundled Selenium Grid program is stripped from selenium.conf at build time (see Dockerfile);
; this program takes its place as the container's main workload. Priority 20 starts it after the
; display stack (xvfb=0, vnc=5, novnc=10) so Chrome has a display when the API drives it.

[program:pennyspy]
priority=20
command=/opt/venv/bin/pennyspy_api
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true

;Logs (redirected to stdout so they can be seen through "docker logs")
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
